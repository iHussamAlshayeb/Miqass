name: miqass-local

services:
  app:
    image: miqass-local-app
    build: &app-build
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_URL: /api
        VITE_CANONICAL_ORIGIN: https://www.miqass.app
        VITE_ONESIGNAL_PRIMARY_ORIGIN: https://www.miqass.app
        VITE_ONESIGNAL_ALLOWED_ORIGINS: https://www.miqass.app
    env_file:
      - Miqass.env
      - .local-secrets/miqass-zakaty.env
    environment:
      NODE_ENV: production
      PORT: 5000
      BACKEND_URL: https://www.miqass.app
      FRONTEND_URL: https://www.miqass.app
      ZAKATY_BASE_URL: https://zakat.ihussam.dev
      DISABLE_CRON_JOBS: ${MIQASS_DISABLE_CRON_JOBS:-false}
    ports:
      - "127.0.0.1:15000:5000"
    # DNS خارجي ثابت: خادم DNS الداخلي في Docker Desktop يتعطل أحياناً ("server misbehaving")
    # فتنقطع MongoDB Atlas ومزوّد واتساب. أسماء الخدمات (app وغيرها) تبقى تعمل كما هي.
    dns: &public-dns
      - 1.1.1.1
      - 8.8.8.8
      - 1.0.0.1
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:5000/api/health
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3

  # خدمة رسائل واتساب المستقلة: نفس الكود، عملية منفصلة بلا منافذ خارجية.
  # وضع الإرسال يُضبط في Miqass.env (يقرؤه app وwhatsapp معاً فلا يختلفان):
  #   MIQASS_WHATSAPP_DELIVERY=queue  ← خدمة whatsapp ترسل
  #   بدون السطر أو inline            ← الخادم يرسل والخدمة في الاستعداد (لا تتكرر رسالة)
  whatsapp:
    image: miqass-local-app
    build: *app-build
    command: ["node", "whatsappService.js"]
    env_file:
      - Miqass.env
      - .local-secrets/miqass-zakaty.env
    environment:
      NODE_ENV: production
      MIQASS_ROLE: whatsapp
      BACKEND_URL: https://www.miqass.app
      FRONTEND_URL: https://www.miqass.app
      DISABLE_CRON_JOBS: ${MIQASS_DISABLE_CRON_JOBS:-false}
      WHATSAPP_SERVICE_PORT: 5100
    dns: *public-dns
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:5100/health
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3

  backup:
    build:
      context: ./backup
    env_file:
      - Miqass.env
    environment:
      BACKUP_KEEP: 7
      BACKUP_UTC_HOUR: 0
    volumes:
      - ./backups:/backups
    restart: unless-stopped

  cloudflared:
    # التحديث يتم بمهمة يومية (scripts/update-tunnel.ps1) وليس عند كل تشغيل:
    # السحب الإجباري كان يؤخر تشغيل النفق أو يمنعه إذا تأخر Docker Hub بعد إعادة تشغيل الجهاز.
    image: cloudflare/cloudflared:latest
    env_file:
      - .cloudflared/tunnel.env
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - http2
      # إغلاق أسرع عند التحديث اليومي أو إعادة التشغيل (الافتراضي 30 ثانية يبقي الموقع متوقفاً أطول)
      - --grace-period
      - 10s
      - run
      - --url
      - http://app:5000
      - d8545d1d-baaf-460c-bc04-8663c5ee9e23
    # نفس DNS الخارجي: إعادة الاتصال بـ Cloudflare تبحث عن عناوين الحافة في كل مرة
    dns: *public-dns
    # النفق لا ينتظر "صحة" التطبيق: انتظارها كان يمنع تشغيل النفق كلياً إذا تأخر التطبيق،
    # والتطبيق يقلع خلال ثوانٍ فتمر الطلبات الأولى فقط بخطأ مؤقت
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
    profiles:
      - public

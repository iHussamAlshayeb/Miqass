name: miqass-local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_URL: /api
        VITE_CANONICAL_ORIGIN: https://www.miqass.app
        VITE_ONESIGNAL_PRIMARY_ORIGIN: https://www.miqass.app
        VITE_ONESIGNAL_ALLOWED_ORIGINS: https://www.miqass.app
    env_file:
      - Miqass.env
      - .local-secrets/miqass-zakaty.env
    environment:
      NODE_ENV: production
      PORT: 5000
      BACKEND_URL: https://www.miqass.app
      FRONTEND_URL: https://www.miqass.app
      ZAKATY_BASE_URL: https://zakat.ihussam.dev
      DISABLE_CRON_JOBS: ${MIQASS_DISABLE_CRON_JOBS:-false}
    ports:
      - "127.0.0.1:15000:5000"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:5000/api/health
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3

  backup:
    build:
      context: ./backup
    env_file:
      - Miqass.env
    environment:
      BACKUP_KEEP: 7
      BACKUP_UTC_HOUR: 0
    volumes:
      - ./backups:/backups
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    env_file:
      - .cloudflared/tunnel.env
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - http2
      - run
      - --url
      - http://app:5000
      - d8545d1d-baaf-460c-bc04-8663c5ee9e23
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - public
